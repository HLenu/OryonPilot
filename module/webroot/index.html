<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>OryonPilot</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0f14; color: #e6edf5;
    font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-bottom: 1px solid #223040; font-size: 12px; color: #9fb0c3; }
  .bar b { color: #e6edf5; font-size: 13px; }
  iframe { flex: 1; width: 100%; border: 0; background: #0b0f14; }
  .fallback { padding: 18px; font-size: 13px; color: #9fb0c3; line-height: 1.7; }
  .fallback a { color: #4cc2ff; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; background: #16202c;
    padding: 1px 5px; border-radius: 4px; color: #4cc2ff; }
  .err { color: #ffc857; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <b>OryonPilot</b>
    <span id="status">正在连接本地控制台…</span>
  </div>
  <iframe id="console" src="http://127.0.0.1:8787/" title="OryonPilot Console"></iframe>
  <div class="fallback" id="fallback" hidden>
    <p class="err">无法载入本地控制台。</p>
    <p>守护进程可能尚未启动，或端口被修改。请检查：</p>
    <p>1. 模块是否已启用并重启过设备；<br />
       2. <code>/data/adb/neurosched/logs/neurosched.log</code> 是否有启动记录；<br />
       3. 在终端执行 <code>su -c "/data/adb/modules/neurosched/bin/neuroschedd --status"</code> 查看状态。</p>
    <p>也可以直接在浏览器打开 <a href="http://127.0.0.1:8787/" target="_blank" rel="noopener">http://127.0.0.1:8787/</a>（需要 root 或本机浏览器）。</p>
    <p>令牌文件：<code>/data/adb/neurosched/token</code></p>
  </div>
</div>
<script>
  (function () {
    var frame = document.getElementById("console");
    var status = document.getElementById("status");
    var fallback = document.getElementById("fallback");
    var timer = setTimeout(function () {
      status.textContent = "连接超时";
      fallback.hidden = false;
    }, 4000);
    frame.addEventListener("load", function () {
      clearTimeout(timer);
      status.textContent = "控制台已载入，请在页面内确认连接状态";
    });
    frame.addEventListener("error", function () {
      clearTimeout(timer);
      status.textContent = "连接失败";
      fallback.hidden = false;
    });
  })();
</script>
</body>
</html>
